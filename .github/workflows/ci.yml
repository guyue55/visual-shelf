name: Validate library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: bash -n scripts/service.sh
      - run: python -m unittest discover -s tests -v
      - run: python scripts/library.py validate
      - run: python scripts/library.py build
      - run: node --check site/app.js
      - run: node --check site/catalog-model.js
      - run: node --test tests/catalog-model.test.cjs
      - run: git diff --check
